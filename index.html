<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Testfirma (test av Rediger siden)</title>
<style>
  body { margin:0; font:17px/1.5 system-ui,sans-serif; color:#222; background:#fafaf7; }
  main { max-width:720px; margin:0 auto; padding:24px 16px; }
  .beskjed { background:#1f5f8b; color:#fff; padding:10px 16px; text-align:center; }
  h1 { margin:0 0 4px; } h2 { margin-top:32px; }
  .bilder { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .bilder figure { margin:0; } .bilder img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; display:block; }
  .bilder figcaption { font-size:14px; color:#666; margin-top:4px; }
</style>
</head>
<body>
<div class="beskjed" data-felt="beskjed" data-skjul-tom hidden></div>
<main>
  <h1>Testfirma</h1>
  <p>Et oppdiktet firma for å teste redigeringssiden.</p>
  <h2>Om oss</h2>
  <p data-felt="omoss">Testfirma er et oppdiktet firma som brukes for å teste redigeringssiden.</p>
  <h2>Åpningstider</h2>
  <p data-felt="apningstider">Mandag til fredag 7 til 15</p>
  <h2>Telefon</h2>
  <p data-felt="telefon">000 00 000</p>
  <section data-bilder-seksjon hidden>
    <h2>Siste jobber</h2>
    <div class="bilder" data-bilder></div>
  </section>
</main>
<script src="rediger.js"></script>
</body>
</html>
